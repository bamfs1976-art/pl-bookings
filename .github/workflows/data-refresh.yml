name: Data refresh

# Refreshes the app's baked data and regenerates data/pl_data.js.
# Run it from the Actions tab (Run workflow).
#
# Referees are always refreshed — free source, no secret needed
# (football-data.co.uk mirror at github.com/datasets/football-datasets).
#
# Player/club stats need the SS_COOKIE repository secret: the cookie header
# from a logged-in scoutingstats.ai browser session (Settings -> Secrets and
# variables -> Actions -> New secret). Without it, that part is skipped and
# only the referee data updates.
on:
  # DAILY, because the things this rebuilds change daily: transfers, injuries
  # and this season's caution counts. Until this cron existed the Championship
  # and La Liga desks were photographs — neither page makes a single fetch at
  # runtime, so every number on them was whatever the last manual run produced.
  #
  # 04:10 UTC: after the previous evening's fixtures have been processed by the
  # upstream feeds, and well before any kick-off.
  #
  # Cost is not a concern — harvest_apifootball.py documents the whole job at
  # roughly 75 calls against a 7,500/day allowance, and it paces itself to stay
  # under the per-minute ceiling.
  #
  # NOTE ON INPUTS. On a scheduled run every `inputs.*` is empty. The boolean
  # ones are therefore falsy, which would have skipped the Championship and
  # La Liga steps on every cron run while the workflow reported success — so
  # they are read as `github.event_name != 'workflow_dispatch' || inputs.x`,
  # and the season strings carry explicit `|| 'default'` fallbacks.
  schedule:
    - cron: '10 4 * * *'
  workflow_dispatch:
    inputs:
      refs_season:
        description: "football-data season code for referees (e.g. 2526)"
        required: false
        default: "2526"
      season_pl:
        description: "ScoutingStats season id for the Premier League (blank = current)"
        required: false
        default: ""
      season_ch:
        description: "ScoutingStats season id for the Championship (blank = current)"
        required: false
        default: ""
      season_af:
        description: "API-Football season START YEAR, overriding the automatic form-season choice (2025 = 2025-26). Blank = let scripts/form-season.mjs decide. NOT a ScoutingStats id."
        required: false
        default: ""
      season_fixtures:
        description: "API-Football season START YEAR for the FIXTURE LIST — the season being played (2026 = 2026-27)."
        required: false
        default: "2026"
      fit_model:
        description: "Fit the card model on FPL per-match history (Tier 2). Keeps the season prior until enough matches exist."
        type: boolean
        required: false
        default: true
      player_matches:
        description: "Harvest per-player per-fixture minutes/fouls/cards for the Championship and La Liga (one API call per finished fixture — a whole season is ~900). Off by default; turn on to backfill or refresh the training tables."
        type: boolean
        required: false
        default: false
      player_matches_limit:
        description: "Cap the fixtures fetched per league (blank = the whole season). Use a small number to inspect the harvest's foul coverage without spending the day's quota."
        required: false
        default: ""
      refresh_eflc:
        description: "Also refresh EFL Championship referees (free source, no key). The first leg of the Championship desk."
        type: boolean
        required: false
        default: true
      refresh_laliga:
        description: "Also refresh the La Liga desk. Needs the API key: Spain's free match records carry every card but never the official."
        type: boolean
        required: false
        default: true
      season_sp:
        description: "football-data season code for SPAIN's club rates and referee join (e.g. 2526 = the season just played)."
        required: false
        default: "2526"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The `secrets` context is NOT available in `if:` conditions — using it
    # there makes the whole workflow fail to parse. Map it to a job-level env
    # var, which `if:` can read, so the ScoutingStats steps can be skipped
    # cleanly when the cookie isn't set.
    env:
      SS_COOKIE: ${{ secrets.SS_COOKIE }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # WHICH SEASON'S FORM, decided from the fixture files rather than from a
      # literal in this file.
      #
      # Every player rate on all three desks came from a squad harvest pinned
      # to `'2025'`. In August that is right — nobody has 2026-27 form because
      # nobody has played. In October it is wrong in the way no guard catches
      # and no page shows: the numbers still look like numbers, they are simply
      # last year's, and nothing here would ever have changed that. The
      # transition depended on a human remembering, on a schedule with no
      # reminder attached.
      #
      # scripts/form-season.mjs answers it per league, flipping at round 6 (the
      # point the k=6 shrinkage already treats as the balance between a
      # player's own record and the prior) and never later than round 10.
      # Emits nothing for a league whose fixtures it cannot read, so the `||`
      # fallbacks below keep the old behaviour rather than guessing.
      - name: Decide which season's form to harvest
        id: form
        run: node scripts/form-season.mjs --github >> "$GITHUB_OUTPUT"

      # One run's worth, not an ever-growing pile.
      - name: Start this run's Spanish harvest log
        run: |
          echo "La Liga harvest — run ${{ github.run_number }}" > data/laliga_harvest.log

      - name: Refresh referees (free source, always runs)
        run: python3 data/build_refs.py --season "${{ inputs.refs_season || '2526' }}"

      # Extends the referee career history past the frozen epldata baseline
      # (1992/93-2017/18) from the same free match records. Idempotent: the
      # baseline is pristine in ref_history_base.json and the football-data era
      # is always recomputed, so re-running cannot double-count.
      - name: Extend the referee history (free source, always runs)
        run: python3 data/extend_ref_history.py --to "${{ inputs.refs_season || '2526' }}"

      # The Championship's referee spine — the first leg of the second desk.
      # Free and keyless for exactly the same reason the Premier League's is:
      # football-data.co.uk names the official for English football. It reads
      # the ORIGIN rather than the GitHub mirror, because the mirror carries
      # only the top five European leagues (see data/leagues.py).
      #
      # continue-on-error: this is not what the live Premier League desk runs
      # on. An origin outage must leave the shipped Championship seed in place,
      # not take the Premier League refresh down with it.
      - name: Refresh EFL Championship referees (free source, no key)
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.refresh_eflc) }}
        continue-on-error: true
        run: python3 data/build_refs.py --league EFLC --season "${{ inputs.refs_season || '2526' }}"

      # Head-to-head card history, from the same public-domain match records the
      # referee and venue-split builds already read. No key, no new source.
      #
      # The Championship is the one that MUST run here. The GitHub mirror does
      # not carry it, so it reads football-data.co.uk directly, which the build
      # sandbox cannot reach — this workflow is the only place it can be built.
      # continue-on-error for the same reason as the step above: an origin
      # outage must leave the shipped file in place rather than empty it.
      - name: Head-to-head history (Championship, La Liga)
        continue-on-error: true
        run: |
          python3 data/build_h2h.py --league EFLC || echo "EFLC h2h unavailable this run"
          python3 data/build_h2h.py --league LL   || echo "LL h2h unavailable this run"

      # LEGACY, and Premier League only. Kept because pl_data.js is still built
      # on a ScoutingStats basis and switching that changes every published
      # number, which is a decision of its own rather than a side effect of
      # this one. It is also unlikely to work here at all: the cookie carries
      # cf_clearance, which Cloudflare binds to the IP and User-Agent that
      # solved its challenge, so a runner replaying a desktop browser's session
      # is the case that cannot pass. continue-on-error accordingly — the
      # Championship must not be blocked by a Premier League leg that was
      # always going to need running by hand.
      - name: Harvest players from ScoutingStats (legacy, PL only)
        if: ${{ env.SS_COOKIE != '' }}
        continue-on-error: true
        env:
          SS_SEASON_PL: ${{ inputs.season_pl }}
          SS_SEASON_CH: ${{ inputs.season_ch }}
        run: python3 data/harvest.py

      # THE squad route now, not a fallback. Runs AFTER the ScoutingStats step
      # so it overwrites champ_promoted.json rather than the other way round.
      # The ScoutingStats endpoint was
      # retired from this pipeline after producing six distinct ways of
      # returning a partial league that looked complete — page-one-as-league,
      # a per_page cap, unstable ties, a silently ignored sort field,
      # deterministic page-seam loss, and throttling. None of them errored.
      #
      # API-Football fetches per CLUB, so a walk is one squad rather than a
      # slice of a league, and its paging.total is a cross-check the walk is
      # held to. It needs a key rather than a browser cookie, so unlike the
      # cookie route it can run here at all.
      # Says what the key IS before anything tries to use it. "Missing
      # application key" and "your plan does not cover this season" both arrive
      # as a refused request, and they need opposite fixes.
      - name: Check the API-Football key
        if: ${{ env.API_FOOTBALL_KEY != '' }}
        continue-on-error: true
        run: python3 data/harvest_apifootball.py --check

      - name: Harvest the Championship from API-Football
        if: ${{ env.API_FOOTBALL_KEY != '' }}
        continue-on-error: true
        env:
          # NOT season_ch: that is a ScoutingStats season id (five digits),
          # while API-Football names a season by its starting year.
          # FORM, so it transitions — see "Decide which season's form" above.
          API_FOOTBALL_SEASON: ${{ inputs.season_af || steps.form.outputs.form_eflc || '2025' }}
        run: python3 data/harvest_apifootball.py --league EFLC

      # WHO IS AT EACH CLUB NOW, which the form harvest above cannot answer.
      # /players?league&season is the STATISTICS endpoint: pointed at 2025-26 it
      # returns everyone who APPEARED for that club last season, loanees who
      # went back and January departures included. Correct for form, wrong for
      # membership — the Championship shipped 40.6 players a club and La Liga
      # 39.1, against the FPL-reconciled Premier League's 30.1.
      #
      # continue-on-error, and the builders do nothing without the file, so a
      # failed roster leaves the squads exactly as they were rather than
      # emptying a division. NO SEASON: "who is at this club" has none.
      - name: Harvest the Championship's current rosters (membership, not form)
        if: ${{ env.API_FOOTBALL_KEY != '' }}
        continue-on-error: true
        env:
          # THE SEASON BEING PLAYED, not the form season, and this is not a
          # detail. The rosters themselves have no season — but the CLUB LIST
          # this harvest walks is discovered from /teams?league&season, so
          # inheriting the 2025 default asked last season's division for its
          # rosters: 21 of 24 clubs, with the promoted three missing entirely.
          # The floor in reconcile_squads refused the whole file, correctly,
          # and the squads were left exactly as they were.
          API_FOOTBALL_SEASON: ${{ inputs.season_fixtures || '2026' }}
        run: python3 data/harvest_apifootball.py --league EFLC --roster

      # THIS season's Championship cautions, for the suspension ladder. A
      # different harvest from the squads: those are 2025-26 FORM, this is
      # 2026-27 STATE, and the English ladder counts only the current season.
      - name: Harvest this season's Championship cautions (suspension ladder)
        if: ${{ env.API_FOOTBALL_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.refresh_eflc) }}
        continue-on-error: true
        env:
          API_FOOTBALL_SEASON: ${{ inputs.season_fixtures || '2026' }}
        run: python3 data/harvest_apifootball.py --league EFLC --out eflc_season_cards.json

      # The Premier League division, for the three clubs RELEGATED into the
      # Championship — Burnley, West Ham and Wolves played there last season,
      # so their form is a PL record and no Championship harvest contains it.
      #
      # Writes pl_af_players.json, NOT pl_players.json. Keeping it separate is
      # the point: pl_data.js is still built on a ScoutingStats basis and
      # switching that moves every published number on the live desk. The
      # Championship gets the better source without that decision being made
      # for the Premier League as a side effect.
      - name: Harvest the Premier League from API-Football (the relegated three)
        if: ${{ env.API_FOOTBALL_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.refresh_eflc) }}
        continue-on-error: true
        env:
          # FORM (the relegated three's own record), so it transitions with the
          # Championship harvest it feeds.
          API_FOOTBALL_SEASON: ${{ inputs.season_af || steps.form.outputs.form_eflc || '2025' }}
        run: python3 data/harvest_apifootball.py --league PL --out pl_af_players.json

      # The Championship fixture list. Separate from the squads because it
      # moves on a different clock: squads are last season's form and change
      # once, fixtures gain a referee as each appointment is published, so
      # this is the step worth re-running weekly in season.
      - name: Harvest the Championship fixtures from API-Football
        if: ${{ env.API_FOOTBALL_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.refresh_eflc) }}
        continue-on-error: true
        env:
          API_FOOTBALL_SEASON: ${{ inputs.season_fixtures || '2026' }}
        run: python3 data/harvest_apifootball.py --fixtures --league EFLC

      # ── La Liga ─────────────────────────────────────────────────────────
      #
      # ORDER MATTERS HERE and nowhere else in this file. Spain's division is
      # DISCOVERED rather than declared: --clubs reads the twenty off /teams
      # and writes laliga_clubs.json, and every step after it resolves club
      # names through that registry. Run the squads first and they resolve
      # against an empty vocabulary, which is a harvest of nothing.
      - name: Discover the La Liga division (writes the club registry)
        if: ${{ env.API_FOOTBALL_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.refresh_laliga) }}
        continue-on-error: true
        env:
          API_FOOTBALL_SEASON: ${{ inputs.season_fixtures || '2026' }}
        run: |
          echo "== discover ==" >> data/laliga_harvest.log
          python3 data/harvest_apifootball.py --league LL --clubs 2>&1 | tee -a data/laliga_harvest.log

      - name: Harvest the La Liga squads from API-Football
        if: ${{ env.API_FOOTBALL_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.refresh_laliga) }}
        continue-on-error: true
        env:
          # FORM, so it transitions — see "Decide which season's form" above.
          API_FOOTBALL_SEASON: ${{ inputs.season_af || steps.form.outputs.form_ll || '2025' }}
        run: |
          echo "== squads ==" >> data/laliga_harvest.log
          python3 data/harvest_apifootball.py --league LL 2>&1 | tee -a data/laliga_harvest.log

      # The same membership harvest for Spain — see the Championship's above.
      - name: Harvest La Liga's current rosters (membership, not form)
        if: ${{ env.API_FOOTBALL_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.refresh_laliga) }}
        continue-on-error: true
        env:
          # This season's division, for the same reason as the Championship's
          # above: 17 of 20 clubs came back when this inherited 2025.
          API_FOOTBALL_SEASON: ${{ inputs.season_fixtures || '2026' }}
        run: |
          echo "== rosters ==" >> data/laliga_harvest.log
          python3 data/harvest_apifootball.py --league LL --roster 2>&1 | tee -a data/laliga_harvest.log

      # THIS season's cautions, for the suspension strip. A different harvest
      # from the squads above and it has to be: those are 2025-26 FORM, while a
      # suspension cycle is 2026-27 STATE, and RFEF art. 112 accumulation does
      # not carry between seasons. Reusing last season's card counts would tell
      # a reader a player is one booking from a ban when the rules have him on
      # zero. Empty until the season starts, which is why the strip is built to
      # say so rather than to show nothing.
      - name: Harvest this season's Spanish cautions (for the suspension strip)
        if: ${{ env.API_FOOTBALL_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.refresh_laliga) }}
        continue-on-error: true
        env:
          API_FOOTBALL_SEASON: ${{ inputs.season_fixtures || '2026' }}
        run: |
          echo "== season-cards ==" >> data/laliga_harvest.log
          python3 data/harvest_apifootball.py --league LL --out laliga_season_cards.json 2>&1 \
            | tee -a data/laliga_harvest.log

      # Segunda División, for the clubs promoted into La Liga — their 2025-26
      # form is a second-tier record and appears in no La Liga harvest. The
      # Spanish counterpart of the League One step below.
      - name: Harvest Segunda from API-Football (the promoted clubs)
        if: ${{ env.API_FOOTBALL_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.refresh_laliga) }}
        continue-on-error: true
        env:
          # PINNED, deliberately. A club promoted into La Liga has no La Liga
          # record to transition TO — its prior-tier form is last season's by
          # definition, and always will be. Not an oversight; do not "fix" it
          # for consistency with the form harvests above.
          API_FOOTBALL_SEASON: ${{ inputs.season_af || '2025' }}
        run: |
          echo "== segunda ==" >> data/laliga_harvest.log
          python3 data/harvest_apifootball.py --league SEG 2>&1 | tee -a data/laliga_harvest.log

      # THE ONE THING SPAIN BUYS. football-data.co.uk publishes every card and
      # every foul in La Liga and has never published an official — 0 of 33
      # seasons, a quirk of that source covering British football rather than
      # a fact about Spain. So the NAME is taken from the COMPLETED season's
      # fixtures and joined onto the free rows by date and both clubs.
      #
      # season_af, NOT season_fixtures: a referee's card rate comes from the
      # season just played, while the fixture list below is the season about to
      # be. Conflating the two gives a desk with no referee data at all.
      - name: Harvest last season's Spanish officials (for the referee join)
        if: ${{ env.API_FOOTBALL_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.refresh_laliga) }}
        continue-on-error: true
        env:
          # PINNED. This is the COMPLETED season, whose officials are joined
          # onto the free match records to build a referee's card rate. The
          # season being played has barely any finished matches and would give
          # a referee table of nothing.
          API_FOOTBALL_SEASON: ${{ inputs.season_af || '2025' }}
        run: |
          echo "== ref-fixtures ==" >> data/laliga_harvest.log
          python3 data/harvest_apifootball.py --ref-fixtures --league LL 2>&1 | tee -a data/laliga_harvest.log

      - name: Harvest the La Liga fixtures from API-Football
        if: ${{ env.API_FOOTBALL_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.refresh_laliga) }}
        continue-on-error: true
        env:
          API_FOOTBALL_SEASON: ${{ inputs.season_fixtures || '2026' }}
        run: |
          echo "== fixtures ==" >> data/laliga_harvest.log
          python3 data/harvest_apifootball.py --fixtures --league LL 2>&1 | tee -a data/laliga_harvest.log

      # The Premier League fixture list. Committed like the other two, which is
      # what lets /today price a PL fixture at all: the desk itself reads
      # fixtures from the live FPL feed at runtime, and a static page cannot.
      # season_fixtures, not season_af — this is the season being played.
      - name: Harvest the Premier League fixtures from API-Football
        if: ${{ env.API_FOOTBALL_KEY != '' }}
        continue-on-error: true
        env:
          API_FOOTBALL_SEASON: ${{ inputs.season_fixtures || '2026' }}
        run: python3 data/harvest_apifootball.py --fixtures --league PL

      # Cups and Europe: DATES AND VENUES ONLY, so that rest days are days
      # since the last COMPETITIVE match rather than days since the last league
      # one. On league dates alone, 74.2% of the 2025-26 team-fixtures bucket
      # as "fresh" — three quarters of a season with no midweek football — and
      # the clubs that mislabels are precisely the European ones a fatigue
      # factor is about.
      #
      # TWO SEASONS, because they answer different questions. 2026 is the
      # season being played, which the fixture list needs; 2025 is the season
      # the backtest walks, and a factor judged on league-only rest days there
      # would be judged on the wrong buckets.
      - name: Harvest cup and European dates (fatigue factor)
        if: ${{ env.API_FOOTBALL_KEY != '' }}
        continue-on-error: true
        run: |
          python3 data/harvest_other_fixtures.py --season 2026
          python3 data/harvest_other_fixtures.py --season 2025 \
                  --out pl_other_fixtures_2526.js

      # League One, for the three clubs promoted into the Championship. Only
      # the Championship desk needs it, so it never blocks the Premier League.
      - name: Harvest League One from API-Football (the promoted three)
        if: ${{ env.API_FOOTBALL_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.refresh_eflc) }}
        continue-on-error: true
        env:
          # PINNED, for the same reason as Segunda below: a club promoted into
          # the Championship has no Championship record to transition to.
          API_FOOTBALL_SEASON: ${{ inputs.season_af || '2025' }}
        run: python3 data/harvest_apifootball.py --league L1

      # The squads themselves, free and keyless. This is the leg that closes
      # the year-old hole: the promoted clubs shipped as six forwards and no
      # defender, because the Championship feed only ever returned players who
      # cleared its minutes floor. These rows carry NO form (basis NEW, rates
      # null) and are de-duplicated behind any real Championship rate, so they
      # fill the squads out without inventing a number for anyone.
      #
      # It now also writes fpl_squads.json — every club, not only the promoted
      # three — which is what build_pl_data reconciles the squads against. The
      # club a player belongs to came from the cookie-fed harvest, so when that
      # cookie stopped working the squads stopped moving while the refresh went
      # on reporting success: on 19 August 2026, forty players were priced at a
      # club they had left. This feed is free and keyless and cannot go stale
      # that way.
      - name: Fill the promoted clubs' squads from the FPL feed (free, no key)
        run: python3 data/harvest_fpl_squads.py

      # Always runs now. Any source that did not harvest today falls back to
      # what it produced last time, read back out of the shipped pl_data.js —
      # so a missing cookie means "the Premier League rows are unchanged", not
      # "the Premier League is empty". Every fallback is named in the log.
      - name: Rebuild pl_data.js from the harvest
        run: python3 data/build_pl_data.py

      # After build_pl_data regenerates CLUBS, re-add the home/away
      # cards-against splits (same free source as the referees step).
      - name: Refresh club home/away splits
        run: python3 data/build_club_splits.py --season "${{ inputs.refs_season || '2526' }}"

      # Keep the season-prior model in sync with any refreshed player data.
      - name: Refresh the season-prior model
        run: node scripts/build-model.mjs

      # The Championship dataset. Reuses the harvest the Premier League build
      # already did: data/harvest.py fetches the WHOLE of ScoutingStats league 8
      # and league 9, and the Premier League build keeps a slice of each — so 21
      # of these 24 squads need no extra fetching, only 2025-26 season ids.
      #
      # continue-on-error, and it writes its own file: the live Premier League
      # desk must not be able to fail because the second desk's squads are
      # short. It refuses to write rather than shipping a partial league, so a
      # failure here leaves the previous eflc_data.js exactly as it was.
      - name: Build the Championship dataset
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.refresh_eflc) && env.SS_COOKIE != '' }}
        continue-on-error: true
        run: python3 data/build_eflc_data.py --season "${{ inputs.refs_season || '2526' }}"

      # The La Liga dataset, then its referees — in that order, because
      # build_refs.py --league LL patches the REFS block of a file the build
      # has to have written first. Both write their own status file, so a
      # failure inside continue-on-error still leaves a record in the repo
      # rather than only in a log pane somebody has to open.
      - name: Build the La Liga dataset
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.refresh_laliga) }}
        continue-on-error: true
        run: |
          echo "== build ==" >> data/laliga_harvest.log
          python3 data/build_laliga_data.py --season "${{ inputs.season_sp || '2526' }}" 2>&1 | tee -a data/laliga_harvest.log

      - name: Join the Spanish referees onto the free match records
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.refresh_laliga) }}
        continue-on-error: true
        run: |
          echo "== referee-join ==" >> data/laliga_harvest.log
          python3 data/build_refs.py --league LL --season "${{ inputs.season_sp || '2526' }}" 2>&1 | tee -a data/laliga_harvest.log

      # Re-vendor Plsimulator's match model, which it refits weekly and
      # publishes CORS-open at plsimulation.netlify.app/model.json. Feeds the
      # game-state factor and the fitted closeness signal.
      #
      # continue-on-error: the desk works without it — every factor the match
      # model drives is neutral when the file is absent or a fixture is
      # unrated — so an unreachable simulator must not take the whole data
      # refresh down. The previous bundle stays committed and keeps working;
      # check-data.mjs warns once it is more than 45 days old.
      - name: Re-vendor the match model from Plsimulator
        continue-on-error: true
        run: node scripts/build-sim-model.mjs

      # THE FOULS HALF OF THE RISK SCORE. FPL carries yellow cards but no
      # fouls, so before this step `p.f` was 2025-26 form for the whole season
      # while the yellow half moved weekly — one score on two seasons, with
      # nothing on the page saying which. FPL-Core-Insights publishes
      # fouls_committed per player per match, free and keyed by the official
      # FPL player id, and refreshes twice a day; this re-vendors it.
      #
      # continue-on-error for the same reason as the simulator above: without
      # the file the desk falls back to baked fouls, which is where it was
      # before the feature, and check-core-insights.mjs refuses a file that is
      # present and about the wrong season. An unreachable GitHub raw endpoint
      # must not take the whole refresh down.
      - name: Re-vendor this season's fouls from FPL-Core-Insights
        continue-on-error: true
        run: node scripts/build-core-insights.mjs

      # Tier 2, THE OTHER TWO DIVISIONS. The FPL leg below covers the Premier
      # League only — FPL has no Championship and no La Liga — so until this
      # step existed `build-model.mjs --fit` could not be fitted for two of the
      # three desks at all. /fixtures/players carries per-player minutes, fouls
      # and cards for any league the key covers: the label and both features.
      #
      # One call per finished fixture, so a whole completed season is ~380
      # (La Liga) or ~552 (Championship) against a 7,500/day allowance. Run by
      # hand with --player-matches to backfill a season; this scheduled step
      # exists so the table keeps up once the season is under way.
      #
      # continue-on-error: a training table is not the live desk, and a model
      # that cannot be refitted today must not take the data refresh down.
      # DELIBERATELY read bare, unlike every other boolean in this file. The
      # others use `github.event_name != 'workflow_dispatch' || inputs.x` so a
      # cron run does not skip them. This one SHOULD skip on cron: it is ~900
      # API calls and the training table is a backfill, not a daily need. Turn
      # it on by hand when refreshing the tables.
      - name: Per-match training tables (Championship, La Liga)
        if: ${{ env.API_FOOTBALL_KEY != '' && inputs.player_matches }}
        continue-on-error: true
        env:
          # PINNED. A backfill of a whole completed season, run by hand; the
          # operator names the season they are backfilling. Following the form
          # transition would silently repoint a backfill mid-run.
          API_FOOTBALL_SEASON: ${{ inputs.season_af || '2025' }}
        run: |
          LIM=""
          [ -n "${{ inputs.player_matches_limit }}" ] && LIM="--limit ${{ inputs.player_matches_limit }}"
          # One run's worth, not an ever-growing pile.
          : > data/fit_report.txt
          for L in EFLC LL; do
            NAME=$([ "$L" = "LL" ] && echo "La Liga" || echo "Championship")
            python3 data/harvest_apifootball.py --player-matches --league $L $LIM \
              && python3 data/build_match_history.py --league $L \
              && node scripts/backtest.mjs "data/$(echo $L | tr A-Z a-z)_match_history.json" \
                   --label "$NAME" --out data/fit_report.txt \
              || echo "::warning::$L training table unavailable this run"
          done
          # REPORT ONLY. Nothing above writes data/model.js or any file a desk
          # reads — the backtest prints and appends, and that is the whole
          # point: it answers whether a fit would help before anybody changes a
          # published price.
          cat data/fit_report.txt || true

      # THE BOOKINGS LEDGER — who has been booked this season, and in which
      # rounds. One call per FINISHED fixture, and `--only-new` skips the ones
      # already in the ledger, so an ordinary morning fetches the round that
      # has just been played rather than re-walking the season: by May a full
      # walk would be 380 calls a league for the sake of ten new matches.
      #
      # Runs on every refresh, including cron, because a leaderboard that
      # updates when somebody remembers to tick a box is a leaderboard nobody
      # trusts. continue-on-error like every other optional leg: a league the
      # plan refuses must not take the refresh down.
      - name: This season's bookings ledger (all three leagues)
        if: ${{ env.API_FOOTBALL_KEY != '' }}
        continue-on-error: true
        env:
          API_FOOTBALL_SEASON: ${{ inputs.season_fixtures || '2026' }}
        run: |
          for L in PL EFLC LL; do
            LOWER=$(echo $L | tr A-Z a-z)
            case $L in
              PL)   LEDGER=pl_bookings.js ;;
              EFLC) LEDGER=eflc_bookings.js ;;
              LL)   LEDGER=laliga_bookings.js ;;
            esac
            python3 data/harvest_apifootball.py --player-matches --league $L \
              --out ${LOWER}_season_matches.json --only-new $LEDGER \
              && python3 data/build_bookings.py --league $L \
                   --from ${LOWER}_season_matches.json --season 2026-27 \
              || echo "::warning::$L bookings ledger unavailable this run"
          done

      # Tier 2: harvest per-match booking history from the public FPL
      # element-summary endpoint and refit the logistic GLM by IRLS. Runs on
      # GitHub's runners, which can reach the FPL API. build-model.mjs keeps the
      # season prior automatically until >=200 real match rows exist, so this is
      # a no-op early in the season and quietly flips the model to "match-fit"
      # once games accumulate. Never fails the refresh.
      - name: Fit the card model on match history (Tier 2)
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.fit_model) }}
        continue-on-error: true
        run: |
          python3 data/harvest_history.py
          node scripts/build-model.mjs --fit data/match_history.json
          # WRITTEN HERE BECAUSE THIS IS WHERE THE DATA IS. The FPL history is
          # harvested a few lines up and is not in the repository, so
          # backtest_report.md cannot be produced on a developer machine that
          # cannot reach the feed — it would have to be hand-written, and a
          # hand-written report is a claim about a run nobody can check.
          node scripts/backtest.mjs --report backtest_report.md || true

      # EVERY GUARD, not a chosen six. This step used to name the checks that
      # felt related to the files this workflow writes, which is the wrong
      # question: the guards re-derive PRICES from the data, so a refresh can
      # break one that has nothing to do with the file it edited.
      # check-match-record.mjs was in none of the three refresh workflows'
      # lists, went red when the Championship rolled to matchday 2, and stayed
      # red on main for three days. scripts/check-all.mjs globs, so a guard
      # written next month is included by existing. ~7s for all of them.
      - name: Guard the dataset
        run: |
          node scripts/check-all.mjs
          node tests/test-core.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pl_data.js data/model.js data/sim_model.js data/ref_history.js
          # The Championship has no data file to fold its referees into yet, so
          # the JSON IS the artifact for now (gitignore carries an exception for
          # it). It folds into eflc_data.js the way pl_refs.json folds into
          # pl_data.js once that file exists.
          # SEPARATELY, one path per call. `git add a b` fails on the whole
          # command when either path matches nothing, so a run that produced
          # the referees but not the dataset staged NEITHER — which is exactly
          # what happened the first time this ran.
          # The head-to-head files MUST be in this list. The Championship one is
          # the whole reason its build step exists here: the mirror does not
          # carry that division, the origin is unreachable from a development
          # machine, and so this workflow is the only place it can be built. A
          # build step whose output is never staged produces the file, prints a
          # cheerful summary, and discards it when the runner is torn down —
          # which is what happened until this line was added, and it is invisible
          # because the step itself passes.
          for f in data/pl_fixtures.js data/laliga_harvest.log \
                   data/pl_other_fixtures.js data/pl_other_fixtures_2526.js \
                   data/h2h.js data/eflc_h2h.js data/laliga_h2h.js \
                   data/eflc_refs.json data/eflc_data.js data/eflc_status.txt data/eflc_fixtures.js \
                   data/laliga_clubs.json data/laliga_refs.json data/laliga_data.js \
                   data/laliga_status.txt data/laliga_fixtures.js data/laliga_ref_fixtures.js \
                   data/player_matches_status.txt data/fit_report.txt \
                   data/pl_bookings.js data/eflc_bookings.js data/laliga_bookings.js \
                   backtest_report.md; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No data or model changes."
          else
            basis=$(node -e "console.log(require('./data/model.js').basis)")
            git commit -m "Refresh data + model (model basis: ${basis})"
            # PUSH INTO A MOVING BRANCH. Four workflows commit to main and
            # they overlap: this run built everything, committed 249 lines of
            # it, was rejected because the lineups bot had pushed meanwhile,
            # and the runner was torn down with the commit still on it. All
            # the work, thrown away, reported as a failed job with no clue
            # that it had succeeded. Rebase onto whatever landed and try
            # again — the commits touch different files, so there is nothing
            # to resolve, only to re-order.
            for attempt in 1 2 3; do
            git push && break
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 5))
            done
          fi
