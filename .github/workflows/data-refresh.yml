name: Data refresh

# Refreshes the app's baked data and regenerates data/pl_data.js.
# Run it from the Actions tab (Run workflow).
#
# Referees are always refreshed — free source, no secret needed
# (football-data.co.uk mirror at github.com/datasets/football-datasets).
#
# Player/club stats need the SS_COOKIE repository secret: the cookie header
# from a logged-in scoutingstats.ai browser session (Settings -> Secrets and
# variables -> Actions -> New secret). Without it, that part is skipped and
# only the referee data updates.
on:
  workflow_dispatch:
    inputs:
      refs_season:
        description: "football-data season code for referees (e.g. 2526)"
        required: false
        default: "2526"
      season_pl:
        description: "ScoutingStats season id for the Premier League (blank = current)"
        required: false
        default: ""
      season_ch:
        description: "ScoutingStats season id for the Championship (blank = current)"
        required: false
        default: ""
      season_af:
        description: "API-Football season START YEAR for the Championship (2025 = 2025-26). NOT a ScoutingStats id."
        required: false
        default: "2025"
      fit_model:
        description: "Fit the card model on FPL per-match history (Tier 2). Keeps the season prior until enough matches exist."
        type: boolean
        required: false
        default: true
      refresh_eflc:
        description: "Also refresh EFL Championship referees (free source, no key). The first leg of the Championship desk."
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The `secrets` context is NOT available in `if:` conditions — using it
    # there makes the whole workflow fail to parse. Map it to a job-level env
    # var, which `if:` can read, so the ScoutingStats steps can be skipped
    # cleanly when the cookie isn't set.
    env:
      SS_COOKIE: ${{ secrets.SS_COOKIE }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh referees (free source, always runs)
        run: python3 data/build_refs.py --season "${{ inputs.refs_season }}"

      # Extends the referee career history past the frozen epldata baseline
      # (1992/93-2017/18) from the same free match records. Idempotent: the
      # baseline is pristine in ref_history_base.json and the football-data era
      # is always recomputed, so re-running cannot double-count.
      - name: Extend the referee history (free source, always runs)
        run: python3 data/extend_ref_history.py --to "${{ inputs.refs_season }}"

      # The Championship's referee spine — the first leg of the second desk.
      # Free and keyless for exactly the same reason the Premier League's is:
      # football-data.co.uk names the official for English football. It reads
      # the ORIGIN rather than the GitHub mirror, because the mirror carries
      # only the top five European leagues (see data/leagues.py).
      #
      # continue-on-error: this is not what the live Premier League desk runs
      # on. An origin outage must leave the shipped Championship seed in place,
      # not take the Premier League refresh down with it.
      - name: Refresh EFL Championship referees (free source, no key)
        if: ${{ inputs.refresh_eflc }}
        continue-on-error: true
        run: python3 data/build_refs.py --league EFLC --season "${{ inputs.refs_season }}"

      # LEGACY, and Premier League only. Kept because pl_data.js is still built
      # on a ScoutingStats basis and switching that changes every published
      # number, which is a decision of its own rather than a side effect of
      # this one. It is also unlikely to work here at all: the cookie carries
      # cf_clearance, which Cloudflare binds to the IP and User-Agent that
      # solved its challenge, so a runner replaying a desktop browser's session
      # is the case that cannot pass. continue-on-error accordingly — the
      # Championship must not be blocked by a Premier League leg that was
      # always going to need running by hand.
      - name: Harvest players from ScoutingStats (legacy, PL only)
        if: ${{ env.SS_COOKIE != '' }}
        continue-on-error: true
        env:
          SS_SEASON_PL: ${{ inputs.season_pl }}
          SS_SEASON_CH: ${{ inputs.season_ch }}
        run: python3 data/harvest.py

      # THE squad route now, not a fallback. Runs AFTER the ScoutingStats step
      # so it overwrites champ_promoted.json rather than the other way round.
      # The ScoutingStats endpoint was
      # retired from this pipeline after producing six distinct ways of
      # returning a partial league that looked complete — page-one-as-league,
      # a per_page cap, unstable ties, a silently ignored sort field,
      # deterministic page-seam loss, and throttling. None of them errored.
      #
      # API-Football fetches per CLUB, so a walk is one squad rather than a
      # slice of a league, and its paging.total is a cross-check the walk is
      # held to. It needs a key rather than a browser cookie, so unlike the
      # cookie route it can run here at all.
      - name: Harvest the Championship from API-Football
        if: ${{ env.API_FOOTBALL_KEY != '' }}
        continue-on-error: true
        env:
          # NOT season_ch: that is a ScoutingStats season id (five digits),
          # while API-Football names a season by its starting year.
          API_FOOTBALL_SEASON: ${{ inputs.season_af }}
        run: python3 data/harvest_apifootball.py --league EFLC

      # League One, for the three clubs promoted into the Championship. Only
      # the Championship desk needs it, so it never blocks the Premier League.
      - name: Harvest League One from API-Football (the promoted three)
        if: ${{ env.API_FOOTBALL_KEY != '' && inputs.refresh_eflc }}
        continue-on-error: true
        env:
          API_FOOTBALL_SEASON: ${{ inputs.season_af }}
        run: python3 data/harvest_apifootball.py --league L1

      # The squads themselves, free and keyless. This is the leg that closes
      # the year-old hole: the promoted clubs shipped as six forwards and no
      # defender, because the Championship feed only ever returned players who
      # cleared its minutes floor. These rows carry NO form (basis NEW, rates
      # null) and are de-duplicated behind any real Championship rate, so they
      # fill the squads out without inventing a number for anyone.
      - name: Fill the promoted clubs' squads from the FPL feed (free, no key)
        run: python3 data/harvest_fpl_squads.py

      # Always runs now. Any source that did not harvest today falls back to
      # what it produced last time, read back out of the shipped pl_data.js —
      # so a missing cookie means "the Premier League rows are unchanged", not
      # "the Premier League is empty". Every fallback is named in the log.
      - name: Rebuild pl_data.js from the harvest
        run: python3 data/build_pl_data.py

      # After build_pl_data regenerates CLUBS, re-add the home/away
      # cards-against splits (same free source as the referees step).
      - name: Refresh club home/away splits
        run: python3 data/build_club_splits.py --season "${{ inputs.refs_season }}"

      # Keep the season-prior model in sync with any refreshed player data.
      - name: Refresh the season-prior model
        run: node scripts/build-model.mjs

      # The Championship dataset. Reuses the harvest the Premier League build
      # already did: data/harvest.py fetches the WHOLE of ScoutingStats league 8
      # and league 9, and the Premier League build keeps a slice of each — so 21
      # of these 24 squads need no extra fetching, only 2025-26 season ids.
      #
      # continue-on-error, and it writes its own file: the live Premier League
      # desk must not be able to fail because the second desk's squads are
      # short. It refuses to write rather than shipping a partial league, so a
      # failure here leaves the previous eflc_data.js exactly as it was.
      - name: Build the Championship dataset
        if: ${{ inputs.refresh_eflc && env.SS_COOKIE != '' }}
        continue-on-error: true
        run: python3 data/build_eflc_data.py --season "${{ inputs.refs_season }}"

      # Re-vendor Plsimulator's match model, which it refits weekly and
      # publishes CORS-open at plsimulation.netlify.app/model.json. Feeds the
      # game-state factor and the fitted closeness signal.
      #
      # continue-on-error: the desk works without it — every factor the match
      # model drives is neutral when the file is absent or a fixture is
      # unrated — so an unreachable simulator must not take the whole data
      # refresh down. The previous bundle stays committed and keeps working;
      # check-data.mjs warns once it is more than 45 days old.
      - name: Re-vendor the match model from Plsimulator
        continue-on-error: true
        run: node scripts/build-sim-model.mjs

      # Tier 2: harvest per-match booking history from the public FPL
      # element-summary endpoint and refit the logistic GLM by IRLS. Runs on
      # GitHub's runners, which can reach the FPL API. build-model.mjs keeps the
      # season prior automatically until >=200 real match rows exist, so this is
      # a no-op early in the season and quietly flips the model to "match-fit"
      # once games accumulate. Never fails the refresh.
      - name: Fit the card model on match history (Tier 2)
        if: ${{ inputs.fit_model }}
        continue-on-error: true
        run: |
          python3 data/harvest_history.py
          node scripts/build-model.mjs --fit data/match_history.json
          node scripts/backtest.mjs || true

      - name: Guard the dataset
        run: |
          node scripts/check-data.mjs
          node tests/test-core.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pl_data.js data/model.js data/sim_model.js data/ref_history.js
          # The Championship has no data file to fold its referees into yet, so
          # the JSON IS the artifact for now (gitignore carries an exception for
          # it). It folds into eflc_data.js the way pl_refs.json folds into
          # pl_data.js once that file exists.
          # SEPARATELY, one path per call. `git add a b` fails on the whole
          # command when either path matches nothing, so a run that produced
          # the referees but not the dataset staged NEITHER — which is exactly
          # what happened the first time this ran.
          for f in data/eflc_refs.json data/eflc_data.js; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No data or model changes."
          else
            basis=$(node -e "console.log(require('./data/model.js').basis)")
            git commit -m "Refresh data + model (model basis: ${basis})"
            git push
          fi
