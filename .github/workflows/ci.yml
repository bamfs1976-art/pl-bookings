name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check scripts (Netlify functions, service worker, core, inline)
        run: |
          node --check netlify/functions/fpl.js
          node --check netlify/functions/insights.js
          node --check netlify/functions/model-calibration.js
          node --check sw.js
          node --check assets/core.js
          node --check assets/livecards.js
          node --check assets/charts.js
          node --check assets/push.js
          node --check netlify/lib/webpush.js
          node --check netlify/functions/push-key.js
          node --check netlify/functions/push-subscribe.js
          node --check netlify/functions/push-unsubscribe.js
          node --check netlify/functions/push-cron.js
          node --check data/pl_data.js
          node --check data/model.js
          node --check data/sim_model.js
          node --check data/core_insights.js
          node scripts/check-inline.mjs

      - name: Model builder is reproducible (season prior regenerates cleanly)
        run: node scripts/build-model.mjs

      # The promoted clubs are the one feed with no Premier League fallback,
      # so their coverage is checked at the point the data is built, not only
      # on the shipped file. Pure Python, no network, no cookie.
      - name: Promoted-club coverage guards (harvest + build)
        run: python3 data/test_coverage.py

      - name: API-Football harvest route (mapping and pagination)
        run: python3 data/test_apifootball.py

      # The published-appointments overlay. Its parsing is mundane; its NAME
      # RESOLUTION is not. The desk joins referees by exact string and the card
      # table spells them two ways, so a published full name often does not
      # match — silently, at refFactor = 1. Most of this file guards the line
      # that must not be crossed to fix that: matching on surname alone, which
      # would price a fixture off a colleague's card rate and look correct.
      - name: Published referee appointments (parsing and name resolution)
        run: python3 data/test_appointments.py

      # The per-fixture training table. Both failures it guards are silent: a
      # missing foul count read as zero fits the model as though the player
      # never fouled, and form leaking backwards makes the fit look far better
      # than it is while changing nothing you can see.
      - name: Per-match training table (mapping and leakage)
        run: python3 data/test_player_matches.py

      # The multi-league data layer. Holds the Premier League path byte-stable
      # while a second competition moves in beside it, and holds the rule that
      # a league whose records name no official is refused rather than shipped
      # as an empty ranking.
      - name: League registry and the league-aware referee build
        run: python3 data/test_leagues.py

      # The FPL-squads leg and the previous-build fallback. The first must
      # never turn "no record" into a zero; the second must never turn "did
      # not run" into "returned nothing".
      - name: FPL squads harvest and the previous-build fallback
        run: python3 data/test_fpl_squads.py

      # Fouls won, filled from the API-Football squads the refresh already
      # harvests for the Championship desk. The whole risk is in the join: the
      # two feeds spell a player differently ("Christian Nørgaard" against
      # "C. Nørgaard"), so a full-name match alone finds 19 of 456 and a join
      # that finds nothing at all is indistinguishable, in the shipped file,
      # from a feed that simply carries no fouls. Also pins the fill to being a
      # fill — it may not overwrite a number, invent a player, or read a null
      # rate as nought, because any of those would quietly move the Premier
      # League onto a different source's basis.
      - name: Fouls won fills without moving anything else
        run: python3 data/test_fouls_won.py

      # The La Liga leg. Two failure modes neither English desk has: three
      # feeds spelling the same club three ways (two of them with accents),
      # and a referee join that can half-work and produce a table that looks
      # complete. Both are silent, so both are pinned here.
      - name: La Liga club names and the referee join
        run: python3 data/test_laliga.py

      - name: Data guard (pl_data.js counts, no inline dataset in index.html)
        run: node scripts/check-data.mjs

      # The vendored fouls. Offline, against the committed file. The failure it
      # exists for is not a crash — it is the file being well-formed and about
      # LAST season, which would put a "live rate" marker next to 2025-26
      # numbers. That is worse than the frozen rates this replaced, because
      # those at least said what they were.
      - name: This season's fouls are this season's
        run: node scripts/check-core-insights.mjs

      # Web Push, pinned to RFC 8291's own worked example. An encryption bug
      # here does not throw — the push service returns 201 and the browser
      # silently fails to decrypt, so the only symptom is notifications not
      # arriving and logs that say everything worked.
      - name: Web Push crypto matches the specification's test vector
        run: node tests/test-webpush.mjs

      # The Championship dataset and the page that reads it. Re-derives the
      # prices the page shows and checks they are in a range a bookings market
      # could contain — a model that starts printing 80% is not a syntax error
      # and nothing else would catch it.
      - name: Championship dataset and desk guard
        run: node scripts/check-eflc.mjs

      # The La Liga desk. Checks two things the English guards cannot: that the
      # DISCOVERED club registry and the dataset describe the same division,
      # and that the bought referee join covered a whole season rather than the
      # fraction of it that happened to line up.
      - name: La Liga dataset and desk guard
        run: node scripts/check-laliga.mjs

      # The share cards. They are the one artefact that LEAVES the site, so
      # nobody who sees one can check it against the page it came from. Runs
      # the renderer against a recording stub and asserts the text drawn —
      # pixel-diffing would fail on a font substitution and pass on a wrong
      # number, which is exactly backwards.
      - name: Share cards
        run: node scripts/check-share.mjs

      # Are the three desks pricing the same thing? A calibration check, not a
      # same-numbers check: each must land within a tenth of the card rate its
      # own division produced. They answered different questions for a year,
      # and it only became visible when they appeared on one page together.
      - name: Model convergence across the desks
        run: node scripts/check-models.mjs

      # Can you actually get there? The Championship and La Liga desks were
      # built, guarded, deployed and live while being unreachable from the home
      # page — every page passed its own checks and no check asked whether
      # anything linked to it.
      - name: Every desk reachable from every desk
        run: node scripts/check-nav.mjs

      # The phone. Every failure this guards against was SILENT on iOS and
      # invisible on a desktop: share buttons that do nothing because Safari
      # ignores `download` on a blob URL, a select wide enough to make Safari
      # shrink the whole page rather than overflow, an atomic precache that
      # takes the PWA offline over one renamed file.
      - name: iPhone guards (share sheet, install, touch targets, offline shell)
        run: node scripts/check-mobile.mjs

      # Does the markup have styling behind it? renderMatchday() was ported to
      # two desks without the five rules that make it a layout, so the fixture
      # list rendered as one unstyled paragraph — "Derby CountyL. Travis 19%"
      # — on both. A missing CSS rule throws nothing and fails no selector, so
      # every other guard here passed; it took a screenshot from a phone.
      - name: Every emitted class has a rule behind it
        run: node scripts/check-styles.mjs

      # Nothing opens itself over a page the visitor has not seen. Three desks
      # each fired a guided tour a few hundred ms after load, so a first-time
      # visitor met a dimmed screen and "Step 1 of 4" before a single number —
      # and because the spotlight scrolls its target into view, the page also
      # arrived scrolled past its own heading on a phone. It threw nothing and
      # was the intended behaviour of code that read perfectly well.
      - name: The first run shows the product, not an overlay
        run: node scripts/check-firstrun.mjs

      # Contrast has a right answer, is invisible to whoever picked the colour,
      # and degrades for the people least able to report it. --good-ink sat at
      # 4.43:1 on --bg for as long as the token had existed; --text-3 at 2.70:1;
      # and ten rules used --accent-2 — the league's bright FILL colour — as
      # small uppercase text. 17 failing pairs, none of which anything checked.
      - name: Every text colour clears WCAG AA
        run: node scripts/check-contrast.mjs

      # One palette, four desks. La Liga was built by copying the Championship
      # page, palette and all, so it shipped in the wrong league's purple while
      # its own nav dot and its own share cards were orange. Nothing failed:
      # every page passed its own checks because no check had ever asked
      # whether the four desks were painted from one tin. Also catches the
      # quieter half — a token that exists on one desk and not the others, so
      # the rule using it renders as no colour at all rather than as an error.
      - name: One palette across the four desks
        run: node scripts/check-palette.mjs

      # The security headers must not break the site they protect. Both bugs
      # here were invisible locally because `python -m http.server` does not
      # send _headers: img-src refused all 47 Championship and La Liga crests,
      # and X-Frame-Options: DENY blocked /today's own same-origin data frames
      # on WebKit — empty combined view on every iPhone and iPad, nothing wrong
      # in Chromium.
      - name: Security headers do not break the site
        run: node scripts/check-headers.mjs

      # The referee is the largest multiplier the desks apply, and applying it
      # to nothing looks exactly like applying it — a neutral referee and no
      # referee produce the same page. index.html never loaded the harvested
      # fixture list, so every unassigned Premier League fixture priced at
      # refFactor = 1 for as long as the desk has existed.
      - name: The referee path, end to end
        run: node scripts/check-referees.mjs

      # The pipeline front door against the pipeline. build_data.py is a
      # RUNNER over the same scripts data-refresh.yml calls; two lists of the
      # same steps drift, and a front door that has quietly lost one produces
      # a dataset that looks complete and is missing a column.
      - name: The build front door matches the real pipeline
        run: node scripts/check-build-data.mjs

      # The standing rule — no pick before confirmed lineups — and the sort
      # state screen readers were never told about. Both fail silently: an
      # unwired toggle looks exactly like a wired one, and a table that
      # reorders without announcing it looks fine to anyone who can see it.
      - name: Lineup confirmation and sortable-table state
        run: node scripts/check-lineups.mjs

      # The match-level record: what the desk forecast for a fixture, and what
      # the fixture produced. It is written once before kick-off and never
      # revised, so every way it can drift from the page is silent and
      # permanent — a season of rows grading a model nobody was shown.
      - name: The match record agrees with the desks
        run: node scripts/check-match-record.mjs

      # And the half of that path the harvested feed cannot supply. The EFL
      # publishes its officials a week out as prose; API-Football carries them
      # very late or not at all, so they are ingested into data/appointments.json
      # and re-applied every time the fixture list is written. Both ways that
      # can break are silent — the overlay stops being applied, or the card
      # table's spelling changes and the name no longer joins — and both leave
      # a fixture reading "appointed" while pricing at a neutral referee.
      - name: Published appointments reach the desk
        run: node scripts/check-appointments.mjs

      # The suspension watch. Two silent failures: the Premier League strip
      # counted last season's cautions during the rollover — showing players
      # one booking from a ban having played no matches — and the row was a
      # wrapping flex box, so the third percentage dropped onto a line of its
      # own the moment a label grew. Neither throws; the first renders a
      # plausible list of the wrong players.
      - name: The suspension watch counts and lays out correctly
        run: node scripts/check-suspension.mjs

      - name: Unit tests (PLDCore)
        run: node tests/test-core.mjs
