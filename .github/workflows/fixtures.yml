name: Fixtures and referee appointments

# The cheap, frequent half of the data refresh.
#
# WHY THIS IS SEPARATE FROM data-refresh.yml. Referee appointments are
# published very late and the window differs by country:
#
#   * La Liga  — the CTA publishes the day BEFORE the match, by 16:00 local
#                (a 2025-26 rule change). That is ~14:00 UTC in summer.
#   * Premier League / EFL — PGMOL and the EFL publish a few days out,
#                typically early in the week before a weekend round.
#
# The Spanish window is the binding one: a nightly job cannot carry a La Liga
# appointment for the next day's fixtures at all. So this runs three times a
# day and costs three API calls a run — one /fixtures per league returns a
# whole season. The expensive squad/injury/caution harvest stays daily in
# data-refresh.yml.
#
# It writes ONLY the fixture files. A run that cannot reach the API leaves the
# committed fixtures exactly as they were, which is the right failure: a stale
# appointment is wrong, but an erased one silently reprices every fixture in
# the division at refFactor = 1.

on:
  schedule:
    # Morning (PGMOL / EFL), mid-afternoon and evening (after the Spanish
    # 16:00 CEST publication, with a second pass in case it runs late).
    - cron: '20 7 * * *'
    - cron: '20 15 * * *'
    - cron: '20 19 * * *'
    # AND AFTER THE FOOTBALL. The three above were placed for when APPOINTMENTS
    # are published; this job now also carries the bookings ledger, which is
    # only interesting once matches have FINISHED. These four cover the windows
    # the three divisions actually kick off in — an English 15:00 and 17:30, an
    # English midweek 19:45 and a Spanish 21:00 — so a card shown on Saturday
    # afternoon is on the page within about two hours rather than the following
    # morning. Each run costs three calls plus one per newly finished fixture,
    # because the ledger harvest skips what it already has.
    - cron: '20 17 * * *'
    - cron: '20 21 * * *'
    - cron: '20 23 * * *'
    - cron: '20 1 * * *'
  workflow_dispatch:
    inputs:
      season_fixtures:
        description: "API-Football season START YEAR for the fixture list (2026 = 2026-27)."
        required: false
        default: "2026"

permissions:
  contents: write

concurrency:
  # Three schedules plus manual runs can overlap, and two runs committing the
  # same generated files race each other. Later run wins; the earlier is
  # cancelled rather than pushed on top of.
  group: fixtures
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_SEASON: ${{ inputs.season_fixtures || '2026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Named rather than silent: without the key this job can do nothing, and
      # a green tick on a run that fetched nothing is how the referee layer
      # stayed off for a season without anyone noticing.
      - name: Refuse to run blind
        if: ${{ env.API_FOOTBALL_KEY == '' }}
        run: |
          echo "::error::API_FOOTBALL_KEY is not set — no fixtures or appointments can be fetched."
          exit 1

      - name: Harvest fixtures and appointments
        run: |
          for L in PL EFLC LL; do
            python3 data/harvest_apifootball.py --fixtures --league $L \
              || echo "::warning::$L fixtures unavailable this run — keeping the committed file"
          done

      # THE BOOKINGS LEDGER, here rather than in the daily refresh because a
      # leaderboard of cards shown is stale the moment a match finishes, and
      # data-refresh.yml runs once a day. Incremental: `--only-new` skips every
      # fixture already recorded, so an ordinary run is one fixtures call a
      # league plus one per match that has finished since the last run.
      #
      # continue-on-error, like every optional leg: a league the plan refuses
      # must not take the fixture harvest down with it, and a ledger that fails
      # to build leaves the committed one exactly as it was.
      - name: This season's bookings ledger
        continue-on-error: true
        run: |
          for L in PL EFLC LL; do
            LOWER=$(echo $L | tr A-Z a-z)
            case $L in
              PL)   LEDGER=pl_bookings.js ;;
              EFLC) LEDGER=eflc_bookings.js ;;
              LL)   LEDGER=laliga_bookings.js ;;
            esac
            python3 data/harvest_apifootball.py --player-matches --league $L \
              --out ${LOWER}_season_matches.json --only-new $LEDGER \
              && python3 data/build_bookings.py --league $L \
                   --from ${LOWER}_season_matches.json --season 2026-27 \
              || echo "::warning::$L bookings ledger unavailable this run"
          done

      # The measurement the sourcing note asked for: how many appointments are
      # known, and how far ahead. Printed every run so the lead time by league
      # becomes an observed fact rather than an assumption.
      - name: How many referees are appointed, and how far out
        run: node scripts/ref-coverage.mjs

      # EVERY GUARD, not the four that look related to fixtures — see the note
      # in data-refresh.yml. This job REWRITES the fixture files, so it is the
      # one that can drop the published-appointments overlay, and it is also
      # the one whose output moves the match record, the accas and the matchday
      # rollover. Checked here, before the commit, rather than only afterwards.
      - name: Guard the fixture files
        run: node scripts/check-all.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/pl_fixtures.js data/eflc_fixtures.js data/laliga_fixtures.js \
                   data/pl_bookings.js data/eflc_bookings.js data/laliga_bookings.js; do
            [ -f "$f" ] && git add "$f"
          done
          # appointments.json is hand-ingested, not written here — but staging
          # it costs nothing and means a manual ingest committed by mistake
          # without it cannot leave the overlay behind.
          [ -f data/appointments.json ] && git add data/appointments.json
          # --quiet exits non-zero when there IS something staged, so this is
          # the check, not an error. Three runs a day over a season is ~1,000
          # commits if it pushes unconditionally.
          if git diff --cached --quiet; then
            echo "No fixture or appointment changed."
          else
            git commit -m "Fixtures and referee appointments"
            # PUSH INTO A MOVING BRANCH. Four workflows commit to main and
            # they overlap: this run built everything, committed 249 lines of
            # it, was rejected because the lineups bot had pushed meanwhile,
            # and the runner was torn down with the commit still on it. All
            # the work, thrown away, reported as a failed job with no clue
            # that it had succeeded. Rebase onto whatever landed and try
            # again — the commits touch different files, so there is nothing
            # to resolve, only to re-order.
            for attempt in 1 2 3; do
              git push && break
              echo "push rejected (attempt $attempt) — rebasing onto origin/main"
              git pull --rebase --autostash origin main || exit 1
              sleep $((attempt * 5))
            done
          fi
