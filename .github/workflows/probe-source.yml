name: Probe a source

# A diagnostic, not a data job — the same shape as probe-football-data.yml.
# It fetches nothing into the repository, commits nothing and gates nothing:
# it prints what is actually at a URL so a decision about building on it can be
# made from a measurement instead of a guess.
#
# WHY IT IS NEEDED AT ALL. The agent proxy this repository is worked through
# denies almost every external host, so a source can otherwise only be judged
# from its documentation. That has already cost real work twice: the EFL
# scraper was written against a news index that turns out to be assembled in
# the browser, and it found nothing on two live runs before the byte counts
# explained why. CI is not restricted.
#
# MANUAL ONLY. There is nothing here worth a schedule — the answer changes only
# when a site is rebuilt, and a probe on a timer is a crawl.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL(s) to probe, space-separated."
        required: true
      render:
        description: "Execute the page in a browser and print its text, for a site that assembles its content client-side. Only meaningful for a host that already answers us willingly."
        required: false
        default: "false"

# No `contents: write`. This job has nothing to push and must not be able to.
permissions:
  contents: read

concurrency:
  group: probe-source
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No secret to guard: every request is an unauthenticated GET for a page
      # a reader could open in a browser.
      - name: Look
        run: node scripts/probe-source.mjs ${{ inputs.urls }}

      # THE SAME PAGES, EXECUTED. A plain GET tells you whether the content is
      # in the markup; this tells you what a reader actually sees when it is
      # not. Deliberately a separate step and off by default, because it costs
      # a browser launch and is only worth it once the fetch above has shown a
      # low yield.
      #
      # NOT A WAY PAST A REFUSAL. If the fetch came back as a challenge or a
      # block, the site is saying no and this step is not the answer — it is
      # for a host that serves us happily and simply builds its page in the
      # browser, which is what efl.com and premierleague.com do.
      - name: Look again, in a browser
        if: ${{ inputs.render == 'true' }}
        run: |
          npm install -g playwright-core --silent
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          for p in /usr/bin/google-chrome /usr/bin/google-chrome-stable \
                   /usr/bin/chromium-browser /usr/bin/chromium; do
            [ -x "$p" ] && export PW_CHROMIUM="$p" && echo "chrome: $p" && break
          done
          export NODE_PATH="$(npm root -g)"
          for u in ${{ inputs.urls }}; do
            echo "===================================================="
            echo "$u"
            echo "===================================================="
            node scripts/render-page.mjs "$u" | head -c 4000
            echo
          done
