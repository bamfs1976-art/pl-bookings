# Premier League Bookings Desk. Single static index.html, no build step.
# Live FPL data is proxied through the fpl Netlify Function at /api/fpl/*.
[build]
  publish = "."
  command = ""

[build.environment]
  # The Supabase project URL is public client configuration — it ships in
  # index.html by design (Supabase's model: RLS + anon key in the client),
  # so the secrets scanner must not fail the build on it. Real secrets
  # (service-role key, Anthropic key) are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions]
  directory = "netlify/functions"
  # push-cron requires ../lib/webpush.js and ../../assets/core.js — the second
  # reaches OUTSIDE netlify/, for the suspension ladder the page itself prices
  # with rather than a second copy of the rule that could drift from it.
  # The bundler traces relative requires, but a traced dependency that silently
  # fails to bundle is a function that throws on its first scheduled run and
  # nowhere else, so both are named here explicitly.
  included_files = ["netlify/lib/**", "assets/core.js"]

# The scheduled prediction logger USED to live here, hourly, writing
# plb_predictions. It has been retired in favour of scripts/accas.mjs
# `predict` / `grade`, run from .github/workflows/accas.yml.
#
# Not because it was broken — because it could only ever cover one league. It
# keyed predictions on the FPL `element` id and graded them from the FPL result
# feed, neither of which exists for the Championship or La Liga, so two thirds
# of the desk was ungradeable by construction. The replacement keys on the
# fixture and the player, grades through the same API-Football records the acca
# settler uses, and applies the referee factor the desks apply.
#
# Keeping both would have meant two writers logging the same Premier League
# forecast from two code paths, which is how every pair of things in this
# project has drifted.

[[headers]]
  for = "/*"
  [headers.values]
    # Must match _headers. Both files are applied, so leaving DENY here would
    # have kept /today broken however carefully _headers was fixed — and the
    # two disagreeing on one header is worse than either value alone. See the
    # comment in _headers for why this is SAMEORIGIN rather than DENY.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/data/pl_data.js"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
